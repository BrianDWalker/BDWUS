repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python lint
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.17.0]
        types: [python]
      - id: eslint
        name: React lint
        entry: python scripts/local_checks.py eslint
        language: system
        pass_filenames: false
        files: ^web-ui/.*\.(js|jsx)$
      - id: gitleaks
        name: Secret scan (redacted)
        entry: gitleaks dir --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: vite-build
        name: Production UI build
        entry: python scripts/local_checks.py build
        language: system
        pass_filenames: false
        files: ^web-ui/
      - id: pytest
        name: Mocked API and pricing tests
        entry: python scripts/local_checks.py pytest
        language: system
        pass_filenames: false
        always_run: true
