name: fc-gpt Validation

on:
  push:
    branches: [fc-gpt]
  workflow_dispatch:

jobs:
  web-ui-build:
    name: web-ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./web-ui
        run: npm ci
      - name: Build web UI
        working-directory: ./web-ui
        run: npm run build

  web-ui-route-smoke:
    name: web-ui browser route smoke
    runs-on: ubuntu-latest
    needs: web-ui-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./web-ui
        run: npm ci
      - name: Build web UI
        working-directory: ./web-ui
        run: npm run build
      - name: Install Chromium
        working-directory: ./web-ui
        run: npx playwright install --with-deps chromium
      - name: Run extracted route smoke tests
        working-directory: ./web-ui
        run: npm run test:e2e

  pricing-microservice-tests:
    name: pricing-microservice compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./pricing-microservice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        working-directory: ./pricing-microservice
        run: python -m compileall app
      - name: Run tests
        working-directory: ./pricing-microservice
        run: python -m pytest tests -q

  full-platform-runtime-smoke:
    name: full platform runtime smoke
    runs-on: ubuntu-latest
    needs: pricing-microservice-tests
    env:
      PLATFORM_RUNTIME_SMOKE_MODE: "1"
      STAGING_API_BASE_URL: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./pricing-microservice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start seeded platform API
        working-directory: ./pricing-microservice
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/platform-api.log 2>&1 &
          echo $! > /tmp/platform-api.pid
          for i in {1..30}; do
            if curl -fsS "$STAGING_API_BASE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-api.log
          exit 1
      - name: Hit full platform runtime endpoints
        run: |
          set -euo pipefail
          base="${STAGING_API_BASE_URL%/}"
          curl -fsS "$base/health"
          curl -fsS "$base/health/ready"
          curl -fsS "$base/health/sales"
          curl -fsS "$base/api/sales/bootstrap"
          curl -fsS "$base/api/billing/customers"
          curl -fsS "$base/api/platform/bootstrap"
          curl -fsS "$base/api/platform/customer-service/overview"
          curl -fsS "$base/api/platform/customer-service/tickets"
          curl -fsS "$base/api/ops/bootstrap"
      - name: Stop seeded platform API
        if: always()
        run: |
          if [ -f /tmp/platform-api.pid ]; then
            kill "$(cat /tmp/platform-api.pid)" || true
          fi

  assistant-service-tests:
    name: assistant-service compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./assistant-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        working-directory: ./assistant-service
        run: python -m compileall app
      - name: Run tests
        working-directory: ./assistant-service
        run: python -m pytest tests -q

  deployed-api-baseline-smoke:
    name: deployed API baseline smoke
    runs-on: ubuntu-latest
    steps:
      - name: Hit deployed API baseline endpoints
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://bdwusca.delightfulsea-ef64ed74.westus2.azurecontainerapps.io' }}
        run: |
          set -euo pipefail
          base="${API_BASE_URL%/}"
          curl -fsS "$base/health"
          curl -fsS "$base/health/assistant"
          curl -fsS "$base/health/sales"
          curl -fsS "$base/health/pricing-context"
          curl -fsS "$base/api/sales/bootstrap"
          curl -fsS "$base/api/billing/customers"

  full-platform-staging-smoke:
    name: full platform staging smoke
    runs-on: ubuntu-latest
    steps:
      - name: Hit full platform staging endpoints
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://bdwusca.delightfulsea-ef64ed74.westus2.azurecontainerapps.io' }}
        run: |
          set -euo pipefail
          base="${API_BASE_URL%/}"
          curl -fsS "$base/health"
          curl -fsS "$base/health/ready"
          curl -fsS "$base/health/sales"
          curl -fsS "$base/api/sales/bootstrap"
          curl -fsS "$base/api/billing/customers"
          curl -fsS "$base/api/platform/bootstrap"
          curl -fsS "$base/api/platform/customer-service/overview"
          curl -fsS "$base/api/platform/customer-service/tickets"
          curl -fsS "$base/api/ops/bootstrap"

  deployed-web-smoke:
    name: deployed web route smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./web-ui
        run: npm ci
      - name: Install Chromium
        working-directory: ./web-ui
        run: npx playwright install --with-deps chromium
      - name: Run route smoke tests against deployed web app
        working-directory: ./web-ui
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL || 'https://polite-cliff-080b22c0f-previewgpt.eastus2.7.azurestaticapps.net' }}
        run: npm run test:e2e -- --config=playwright.deployed.config.js
