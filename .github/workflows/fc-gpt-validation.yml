name: fc-gpt Validation

on:
  push:
    branches: [fc-gpt]
  workflow_dispatch:

jobs:
  web-ui-build:
    name: web-ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./web-ui
        run: npm ci
      - name: Build web UI
        working-directory: ./web-ui
        run: npm run build

  pricing-microservice-tests:
    name: pricing-microservice compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./pricing-microservice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        working-directory: ./pricing-microservice
        run: python -m compileall app
      - name: Run tests
        working-directory: ./pricing-microservice
        run: python -m pytest tests -q

  assistant-service-tests:
    name: assistant-service compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./assistant-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        working-directory: ./assistant-service
        run: python -m compileall app
      - name: Run tests
        working-directory: ./assistant-service
        run: python -m pytest tests -q

  staging-smoke:
    name: optional staging smoke
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_API_BASE_URL != '' }}
    steps:
      - name: Hit staging smoke endpoints
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          base="${API_BASE_URL%/}"
          curl -fsS "$base/health"
          curl -fsS "$base/health/ready"
          curl -fsS "$base/health/sales"
          curl -fsS "$base/api/sales/bootstrap"
          curl -fsS "$base/api/platform/bootstrap"
          curl -fsS "$base/api/ops/bootstrap"
