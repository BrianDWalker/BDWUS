name: Portal checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portal-checks:
    name: Portal checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'pricing-microservice/requirements*.txt'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install check dependencies
        run: |
          python -m pip install -r pricing-microservice/requirements-dev.txt
          npm --prefix web-ui ci --no-audit --no-fund
      - name: Ruff
        run: python -m ruff check pricing-microservice scripts
      - name: ESLint
        run: npm --prefix web-ui run lint
      - name: Mocked API and pricing tests
        run: python -m pytest -q
      - name: Vite build
        run: npm --prefix web-ui run build
