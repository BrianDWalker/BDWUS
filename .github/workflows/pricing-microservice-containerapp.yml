name: Deploy Pricing Microservice

on:
  push:
    branches: [main, fc-gpt]
    paths:
      - 'pricing-microservice/**'
      - '.github/workflows/pricing-microservice-containerapp.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: ./pricing-microservice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app
      - working-directory: ./pricing-microservice
        run: docker build -t pricing-microservice:ci .
      - run: echo "Pricing microservice image built successfully. Add Azure deployment secrets to publish automatically."
